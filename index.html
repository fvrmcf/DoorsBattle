<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOORS Case Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-overlay"></div>

<div class="container">
    <header>
        <h1 class="title">🚪 DOORS <span>CASE SIMULATOR</span></h1>
        <div class="balance">
            <span class="coin-icon">🪙</span>
            <span id="balance">1000</span>
        </div>
    </header>

    <div class="cases-grid" id="casesGrid"></div>

    <div class="inventory-section">
        <h2>Инвентарь</h2>
        <div class="inventory" id="inventory"></div>
    </div>
</div>

<!-- Модалка открытия кейса -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalCaseName">Открытие кейса</h2>
        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette" id="roulette"></div>
        </div>
        <button class="btn-open" id="openBtn">Открыть за <span id="openPrice">0</span> 🪙</button>
        <button class="btn-close" id="closeModal">Закрыть</button>
    </div>
</div>

<!-- Модалка результата -->
<div class="result-overlay" id="resultOverlay">
    <div class="result-modal">
        <h3>Вы получили:</h3>
        <div class="result-item" id="resultItem"></div>
        <button class="btn-continue" id="continueBtn">Продолжить</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
